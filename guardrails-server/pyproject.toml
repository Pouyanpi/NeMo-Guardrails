[project]
name = "guardrails-proxy"
version = "0.1.0a1"
description = "A transparent, policy-bound HTTP proxy using NeMo Guardrails."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE-Apache-2.0.txt"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "NVIDIA", email = "nemoguardrails@nvidia.com" }]
dependencies = [
  "anyio>=4,<5",
  "fastapi>=0.103,<1",
  "httpx>=0.24.1,<1",
  "jsonschema>=4.26,<5",
  "nemoguardrails>=0.25.0.dev0,<0.26",
  "pydantic>=2.5,<3",
  "pydantic-core>=2.14,<3",
  "pyyaml>=6,<7",
  "starlette>=0.49.1,<2",
  "typer>=0.8,<1",
  "typing-extensions>=4.8,<5",
  "uvicorn>=0.23,<1",
]

[project.scripts]
guardrails-proxy = "guardrails_proxy.cli:main"

[tool.uv.sources]
nemoguardrails = { workspace = true }

[tool.uv.build-backend]
module-name = "guardrails_proxy"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
