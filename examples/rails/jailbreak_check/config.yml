# Simple example of how to use actions.

user_messages:
  express greeting:
    - hi
    - hello
    - hey there!

  ask about vacation days:
    - how many free days do I get
    - what is the number of free days

flows:
  - elements:
    - user: ...
    - execute: check jailbreak
    - bot: inform if jailbreak attempt  
    - bot: ...
    

  - elements:
    - user_said: ...
    - execute: check jailbreak
    - bot: inform if jailbreak attempt  
    - bot: ...


# Using OpenAI
models:
  - type: main
    engine: openai
    model: text-davinci-003
