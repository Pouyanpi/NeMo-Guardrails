# tox will not do any install.
# uv manages all dependencies and the current package.
# Thus, tests are running against the local files and not the built and installed package.
# How to use:
# do
# > pyenv install 3.10 3.11 3.12
# > pyenv local 3.10 3.11 3.12

[tox]
envlist = py310, py311, py312, py313

[testenv]
description = Run tests with pytest under different Python versions using uv
skip_install = true
allowlist_externals = uv
commands_pre =
    uv sync --group dev
commands =
    uv run pytest tests/ --import-mode importlib

[pytest]
asyncio_default_fixture_loop_scope = function
